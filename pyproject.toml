[project]
name = "aw-shell"
version = "1.4.0"
description = "A hackable desktop shell for Hyprland, powered by Fabric and PySide6"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Adriano Tisera (Axenide)" },
    { name = "Robin Martinsen (Awareness10)" },
]
maintainers = [
    { name = "Robin Martinsen (Awareness10)" },
]
keywords = ["hyprland", "shell", "wayland", "desktop", "fabric", "gtk", "pyside6"]
dependencies = [
    "fabric",
    "glaze>=0.2.3",
    "loguru>=0.7.0",
    "pillow>=13.0.0",
    "psutil>=5.9.0",
    "pycairo>=1.25.0",
    "pygobject>=3.50.0",
    "pyside6>=6.6.0",
    "pywayland>=0.4.17",
    "setproctitle>=1.3.0",
]

[tool.uv.sources]
glaze = { git = "https://github.com/awareness10/glaze" }
fabric = { git = "https://github.com/Fabric-Development/fabric" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "ty>=0.0.107",
    # Also a runtime dependency; here so ty resolves it in CI's dev-only environment
    "loguru>=0.7.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ANN"]
ignore = [
    # gi.require_version() has to run before the gi.repository imports
    "E402",
    # Long f-strings, CSS and markup; wrapping them would only churn the files
    "E501",
    # Any is deliberate where values really are dynamic (JSON, calculator values)
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
# Annotations required only in the modules ty checks ([tool.ty.src] include)
"!{config/legacy.py,config/gtk_theme.py,config/migrate.py,config/paths.py,config/shell_settings.py,config/terminal.py,config/toml_writer.py,utils/bar_layout.py,utils/calculator.py,utils/commands.py,utils/conversion.py,utils/dock_layout.py,utils/dock_model.py,utils/notch_layout.py,utils/notification_history.py,utils/stylesheet.py,utils/wifi.py}" = ["ANN"]
# The old dock code, copied verbatim as the test oracle
"tests/test_dock_model.py" = ["E701", "E702"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
# GTK-free modules only: gi.repository is generated at runtime and fabric's
# widgets take loose keyword arguments, so the rest would be mostly noise.
# Add a module here once it passes; ruff's ANN rules (per-file-ignores) require
# annotations in the same files.
include = [
    "config/legacy.py",
    "config/gtk_theme.py",
    "config/migrate.py",
    "config/paths.py",
    "config/shell_settings.py",
    "config/terminal.py",
    "config/toml_writer.py",
    "utils/bar_layout.py",
    "utils/calculator.py",
    "utils/commands.py",
    "utils/conversion.py",
    "utils/dock_layout.py",
    "utils/dock_model.py",
    "utils/notch_layout.py",
    "utils/notification_history.py",
    "utils/stylesheet.py",
    "utils/wifi.py",
]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing"
filterwarnings = [
    # No GTK3 replacement for the connector name (Gdk.Monitor.get_connector is GTK4)
    "ignore:Gdk.Screen.get_monitor_plug_name is deprecated:DeprecationWarning",
    # Raised inside dependencies, not fixable here
    "ignore::DeprecationWarning:fabric\\.",
    "ignore:g_object_notify.*has no property named:Warning:fabric\\.core\\.service",
    "ignore:Gio.DBusConnection.register_object is deprecated:DeprecationWarning:gi\\.overrides\\.Gio",
    # PyGObject's asyncio integration still uses the event loop policy API that
    # Python 3.14 deprecated (checked 3.58.1); raised inside gi, not fixable here
    "ignore:'asyncio\\.(get_event_loop_policy|AbstractEventLoopPolicy)' is deprecated:DeprecationWarning:gi\\.events",
    # Compile-time warnings (e.g. 'return' in 'finally' in fabric) carry a file path,
    # not a module name; only show up where .pyc files aren't cached, like Docker
    "ignore::SyntaxWarning:.*/site-packages/",
]

[tool.coverage.run]
source = ["config", "modules", "services", "utils", "widgets"]

[tool.uv.audit]
ignore = [
    # CVE-2011-2185 is for the SSH library `fabric` (github.com/fabric/fabric);
    # ours is Fabric-Development/fabric from git, which shares the name only
    "GHSA-xwg2-qc6c-7c3q",
]
