[project]
name = "aw-shell"
version = "1.2.12"
description = "A hackable desktop shell for Hyprland, powered by Fabric and PySide6"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Adriano Tisera (Axenide)" },
    { name = "Robin Martinsen (Awareness10)" },
]
keywords = ["hyprland", "shell", "wayland", "desktop", "fabric", "gtk", "pyside6"]
dependencies = [
    "dbus-python>=1.3.2",
    "fabric",
    "glaze",
    "ijson>=3.3.0",
    "loguru>=0.7.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "pycairo>=1.25.0",
    "pygobject>=3.50.0",
    "pyopengl>=3.1.7",
    "pyside6>=6.6.0",
    "pywayland>=0.4.17",
    "requests>=2.31.0",
    "setproctitle>=1.3.0",
    "toml>=0.10.2",
    "watchdog>=3.0.0",
]

[tool.uv.sources]
glaze = { git = "https://github.com/awareness10/glaze" }
fabric = { git = "https://github.com/Fabric-Development/fabric" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing"
filterwarnings = [
    # No GTK3 replacement for the connector name (Gdk.Monitor.get_connector is GTK4)
    "ignore:Gdk.Screen.get_monitor_plug_name is deprecated:DeprecationWarning",
    # Raised inside dependencies, not fixable here
    "ignore::DeprecationWarning:fabric\\.",
    "ignore:g_object_notify.*has no property named:Warning:fabric\\.core\\.service",
    "ignore:Gio.DBusConnection.register_object is deprecated:DeprecationWarning:gi\\.overrides\\.Gio",
    # Gone in newer PyGObject (checked 3.58), but fabric pins 3.50.0 (3.51+ breaks its enum properties)
    "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning:gi\\._ossighelper",
    # Compile-time warnings (e.g. 'return' in 'finally' in fabric) carry a file path,
    # not a module name; only show up where .pyc files aren't cached, like Docker
    "ignore::SyntaxWarning:.*/site-packages/",
]

[tool.coverage.run]
source = ["config", "modules", "services", "utils", "widgets"]
