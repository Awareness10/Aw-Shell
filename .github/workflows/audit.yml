name: Audit

# Known vulnerabilities in the locked dependencies. Separate from Tests so an
# advisory doesn't mark the tests as failing; weekly because advisories get
# published without any push here. Ignored advisories: pyproject.toml
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Audit dependencies
        run: uv audit --frozen --preview-features audit-command
