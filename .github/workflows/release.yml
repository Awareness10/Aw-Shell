name: Release

# version.json on main is what the in-app updater reads, so a version bump
# there is a release: tag it and publish the new changelog entries as notes.
on:
  push:
    branches: [main]
    paths: [version.json]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release for new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          tag="v$(jq -r .version version.json)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to do"
            exit 0
          fi

          # Notes = changelog entries added since the previous push, <b>x</b> -> **x**
          old=$(git show "$BEFORE:version.json" 2>/dev/null || echo '{"changelog": []}')
          jq -r --argjson old "$old" '.changelog - $old.changelog | .[] | "- " + .' version.json \
            | sed -E 's#<b>([^<]*)</b>#**\1**#g; s#<[^>]+>##g' > notes.md
          [ -s notes.md ] || echo "See version.json for the changelog." > notes.md

          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
